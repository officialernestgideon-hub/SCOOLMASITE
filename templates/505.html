
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Something Went Wrong | SCOOLMASITE</title>

    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f8f7fc;
            text-align: center;
        }

        .error-content {
            width: 100%;
            max-width: 620px;
        }

        .error-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee8ff;
            color: #6c3df5;
            font-size: 38px;
        }

        .error-code {
            margin: 0;
            font-size: clamp(70px, 16vw, 130px);
            line-height: 1;
            font-weight: 800;
            color: #6c3df5;
        }

        .error-title {
            margin: 18px 0 10px;
            font-size: clamp(26px, 5vw, 40px);
            color: #17131f;
        }

        .error-message {
            margin: 0 auto 28px;
            max-width: 500px;
            color: #68636f;
            font-size: 16px;
            line-height: 1.7;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s ease;
        }

        .error-btn-primary {
            background: #6c3df5;
            color: #fff;
        }

        .error-btn-primary:hover {
            background: #5830d0;
            transform: translateY(-1px);
        }

        .error-btn-secondary {
            background: #fff;
            color: #292331;
            border: 1px solid #ddd8e8;
        }

        .error-btn-secondary:hover {
            border-color: #6c3df5;
            color: #6c3df5;
        }

        .error-brand {
            margin-top: 42px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #292331;
        }

        .error-brand span {
            color: #6c3df5;
        }
    </style>
</head>

<body>

<main class="error-page">
    <div class="error-content">

        <div class="error-icon">
            <i class="fas fa-tools"></i>
        </div>

        <h1 class="error-code">500</h1>

        <h2 class="error-title">
            Something went wrong
        </h2>

        <p class="error-message">
            We ran into an unexpected problem while processing your request.
            Please try again in a moment.
        </p>

        <div class="error-actions">

            <a href="{% url 'home' %}" class="error-btn error-btn-primary">
                <i class="fas fa-home"></i>
                Back to Home
            </a>

            <a href="javascript:location.reload()" class="error-btn error-btn-secondary">
                <i class="fas fa-redo"></i>
                Try Again
            </a>

        </div>

        <div class="error-brand">
            SCOOLMA<span>SITE</span>
        </div>

    </div>
</main>

</body>
</html>
